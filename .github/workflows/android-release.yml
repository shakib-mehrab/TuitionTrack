# Builds a signed Android APK on every push to master and publishes it as a GitHub Release.
# The app's in-app update card (components/UpdateCard.tsx) reads the latest release and offers it to users.
# Stable download link (always the newest build):
#   https://github.com/shakib-mehrab/TuitionTrack/releases/latest/download/TuitionTrack.apk
#
# Required repository secrets (run scripts/setup-github-secrets.sh once):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   GOOGLE_SERVICES_JSON_BASE64, and every EXPO_PUBLIC_* value from .env
name: Android release

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_VERSION: 2.0.${{ github.run_number }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$KS" ] || [ -z "$GS" ] || [ -z "$EXPO_PUBLIC_FIREBASE_API_KEY" ]; then
            echo "::error::Missing secrets. Run scripts/setup-github-secrets.sh once (see README)."
            exit 1
          fi

      - name: Version code
        run: echo "APP_VERSION_CODE=$((200 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Firebase config
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > google-services.json

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$KS_ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS --out TuitionTrack.apk aligned.apk
          "$BT/apksigner" verify --print-certs TuitionTrack.apk | head -3
          rm -f release.jks

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}"
          NOTES="TuitionTrack ${TAG} for Android. Download TuitionTrack.apk below and open it to install; if the app is already installed, this updates it. Changes: $(git log -1 --pretty=%s)"
          gh release create "$TAG" TuitionTrack.apk --title "TuitionTrack ${TAG}" --notes "$NOTES" --latest
